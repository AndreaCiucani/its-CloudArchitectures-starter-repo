name: CI - Docker Build

on:
  push:
    branches: ["main"]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: its-node-demo
      # Tag composto da run_id e run_number — univoco per ogni esecuzione
      DATE_TAG: ${{ github.run_id }}-${{ github.run_number }}

    steps:
      # 1 — Scarica il codice del repository nel runner
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2 — Installa Node.js 18
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # 3 — Installa le dipendenze
      - name: Install dependencies
        run: npm install

      # 4 — Costruisce l'immagine con DUE tag:
      #     - github.sha  → hash del commit, identifica esattamente quale codice è dentro
      #     - DATE_TAG    → run_id-run_number, identifica l'esecuzione della pipeline
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:${{ env.DATE_TAG }}

      # 5 — Login a Docker Hub (metodo pipe, più sicuro)
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # 6 — Push di ENTRAMBI i tag su Docker Hub
      #     Nota: il nome deve includere username/ altrimenti Docker Hub rifiuta
      - name: Push images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${{ env.DATE_TAG }}
