name: CI + Docker Build  ##Soluzione con 2 jobs separati: BUILD e DEPLOY

on:
  push:
    branches: ["main"]

jobs:
  # ─────────────────────────────
  # JOB 1 — BUILD
  # ─────────────────────────────
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: its-node-demo
      DATE_TAG: ${{ github.run_id }}-${{ github.run_number }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:${{ env.DATE_TAG }}

      # ✅ Salva con un tag che esiste davvero
      - name: Save Docker image as artifact
        run: |
          docker save $IMAGE_NAME:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  # ─────────────────────────────
  # JOB 2 — DEPLOY
  # ─────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # ✅ Le variabili env vanno ridichiarate nel secondo job
    env:
      IMAGE_NAME: its-node-demo
      DATE_TAG: ${{ github.run_id }}-${{ github.run_number }}

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: gunzip -c image.tar.gz | docker load

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # ✅ Ri-tagga aggiungendo il prefisso username/ richiesto da Docker Hub
      - name: Tag images with Docker Hub username
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${{ github.sha }}
          docker tag $IMAGE_NAME:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${{ env.DATE_TAG }}

      - name: Push images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${{ env.DATE_TAG }}

