name: CI - Scalare con Matrix

on:
  push:
    branches: ["main"]

jobs:
  test-matrix:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16, 18, 20]

    env:
      SERVICE_NAME: its-node-demo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present

  build-image:
    needs: test-matrix
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: its-node-demo
      TAG: ${{ github.sha }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{env.IMAGE_NAME}}:${{env.TAG }} .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Tag image for Docker Hub
        run: |
          docker tag ${{env.IMAGE_NAME}}:${{env.TAG }} ${{ secrets.DOCKERHUB_USERNAME }}/${{env.IMAGE_NAME}}:${{env.TAG }}

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{env.IMAGE_NAME}}:${{env.TAG }}


       # Deploy su PC locale tramite SSH attraverso Ngrok s
  deploy-local:
    needs: build-image
    runs-on: self-hosted

    steps:
      - name: Deploy to local machine
        run: |
          echo ">>> Docker Login"
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
          echo ">>> Pull immagine aggiornata"
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/its-node-demo:latest
          echo ">>> Stop container precedente"
          docker stop its-node-demo || true
          echo ">>> Rimozione container"
          docker rm its-node-demo || true        
          echo ">>> Avvio nuovo container"
          docker run -d \
            -p 8181:3000 \
            --name its-node-demo \
            ${{ secrets.DOCKERHUB_USERNAME }}/its-node-demo:latest